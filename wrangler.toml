name = "brote"
compatibility_date = "2026-08-01"

# Sirve la carpeta public/ como sitio estático.
# not_found_handling = single-page-application: cualquier ruta devuelve index.html,
# que es lo que necesita una SPA con navegación del lado del cliente.
[assets]
directory = "./public"
not_found_handling = "single-page-application"

[observability]
enabled = true

